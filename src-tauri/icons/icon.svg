<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source of the app icon (Simple Suite family: tile, sheen, lifted white card).
       Regenerate every size with: npm run icons -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd6b4"/>
      <stop offset=".5" stop-color="#16a2a0"/>
      <stop offset="1" stop-color="#0f5470"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e3f4f3"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fb3a6"/>
      <stop offset="1" stop-color="#11607a"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-20%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="28" result="b"/>
      <feOffset in="b" dy="32" result="o"/>
      <feFlood flood-color="#06303f" flood-opacity=".45"/>
      <feComposite in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sheen)"/>
  <rect x="65" y="65" width="894" height="894" rx="199" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
  <!-- the card -->
  <rect x="262" y="246" width="500" height="500" rx="96" fill="url(#paper)" filter="url(#lift)"/>
  <!-- both ways -->
  <path d="M424 640V368M352 438L424 366L496 438M600 352V624M528 554L600 626L672 554" fill="none" stroke="url(#ink)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
